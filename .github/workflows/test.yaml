name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # lets tag_and_release.yaml gate the release on this same job via `uses:`
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Every version pyproject.toml's classifiers claim (test_packaging.py).
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      # --frozen resolves from the committed lockfile. That matters because
      # [tool.uv] exclude-newer is a rolling 7-day window: re-resolving here
      # would drift from what was locked.
      - name: Install
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src

      # Tests needing a real BigFix server or local openssl are marked and
      # auto-skip here (see tests/conftest.py).
      - name: Test
        run: uv run pytest -q -rs

  # Every dependency is pure Python today, so the package installs on iOS and
  # Android (the iOS app embeds python.org's framework). This keeps a new
  # dependency without wheels there from slipping in unnoticed.
  mobile-resolve:
    name: resolves for iOS and Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # --only-binary: a mobile app cannot build an sdist, so every package
      # must have a wheel for the platform (or be pure Python).
      - name: iOS and Android resolve from wheels only
        run: |
          set -euo pipefail
          for plat in arm64-apple-ios arm64-apple-ios-simulator aarch64-linux-android; do
            for py in 3.13 3.15; do
              echo "== $plat / $py"
              uv pip compile pyproject.toml --quiet --no-header \
                --python-version "$py" --python-platform "$plat" --only-binary :all:
            done
          done

      # The same command on desktop, so a failure above is the platform's,
      # not a broken pyproject.toml or uv.
      - name: Desktop still resolves
        run: |
          set -euo pipefail
          for plat in aarch64-apple-darwin x86_64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            echo "== $plat"
            uv pip compile pyproject.toml --quiet --no-header --python-version 3.11 \
              --python-platform "$plat" --only-binary :all: | grep '^httpx=='
          done
